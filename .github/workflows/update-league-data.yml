name: 自动更新联赛数据

'on':
  schedule:
    # 每周两次 — 周二/周五 02:12 UTC（覆盖周末 + 周中赛果）
    - cron: '12 2 * * 2'
    - cron: '12 2 * * 5'
  workflow_dispatch:
    # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行联赛数据更新
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python3 backend/data/league_data_updater.py

      - name: 检查是否有变化
        id: check
        run: |
          if [ -n "$(git status --porcelain docs/data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送数据更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "联赛数据机器人"
          git config user.email "bot@football-analysis"

          FINISHED=$(python3 -c "import json; print(sum(1 for m in json.load(open('docs/data/matches_2021.json')) if m['season']=='2026-27' and m['status']=='FINISHED'))")

          git add docs/data/
          git commit -m "auto: 🏆 欧洲联赛数据更新（新赛季已完赛 ${FINISHED} 场）"

          # 用 GITHUB_TOKEN 推送（https 方式）
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push
